name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test -run=^$ -fuzz=FuzzJSONDecodeDoesNotPanic -fuzztime=2s .
      - run: go test -run=^$ -fuzz=FuzzJSONBlobDecodeDoesNotPanic -fuzztime=2s .
      - run: go test -run=^$ -fuzz=FuzzXMLDecodeDoesNotPanic -fuzztime=2s .
      - run: go test -run=^$ -fuzz=FuzzTagParserDoesNotPanic -fuzztime=2s .
      - run: go test -run=^$ -fuzz=FuzzBase64DecodeDoesNotPanic -fuzztime=2s .
